[alembic]
script_location = %(here)s/alembic
# URL database diisi oleh app/db/migrations.py dari ZOI_DATA_DIR — jangan diisi manual.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
